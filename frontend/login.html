<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Music Subscription</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
    }
    h1 { text-align: center; margin-bottom: 1.5rem; color: #1a1a2e; }
    label { display: block; margin-bottom: 0.3rem; font-weight: 600; color: #333; }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 1.2rem;
      font-size: 1rem;
    }
    input:focus { outline: none; border-color: #4f46e5; }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    .msg {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    .msg.error { background: #fee2e2; color: #b91c1c; display: block; }
    .msg.success { background: #d1fae5; color: #065f46; display: block; }
    .footer { text-align: center; margin-top: 1.2rem; font-size: 0.9rem; }
    .footer a { color: #4f46e5; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎵 Music App</h1>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="your@email.com" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••" required />

      <button type="submit">Login</button>
    </form>
    <div class="msg" id="msg"></div>
    <div class="footer">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
